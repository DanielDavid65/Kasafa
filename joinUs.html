<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>انضم إلينا — كشافة ومرشدات سيدة فاتيما</title>
  <link rel="stylesheet" href="joinUs.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <!-- Navigation -->
  <nav>
    <ul>
      <li><a href="index.html">الرئيسية</a></li>
      <li><a href="من نحن.html">من نحن</a></li>
      <li><a href="joinUs.html">انضم إلينا</a></li>
    </ul>
  </nav>

  <div class="page-wrapper">

    
    <div class="form-card">

      <div class="form-header">
        <h2>انضم إلينا</h2>
        <p>انضم لعائلة كشافة ومرشدات سيدة فاتيما</p>
      </div>

      <form action="https://api.web3forms.com/submit" method="POST">

        <!-- Web3Forms key -->
        <input type="hidden" name="access_key" value="9c74551e-d747-486e-b013-03af82894b1a">
        <!-- Redirect after submit (optional) -->
        <input type="hidden" name="redirect" value="https://web3forms.com/success">

        <div class="field-group">
          <label for="name">الاسم</label>
          <input type="text" id="name" name="الاسم" required placeholder="اكتب اسمك الكامل">
        </div>

        <div class="field-group">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" name="الأيميل" required placeholder="example@email.com">
        </div>

        <div class="field-group">
          <label for="address">العنوان</label>
          <input type="text" id="address" name="العنوان" placeholder="المنطقة / الحي">
        </div>

        <div class="field-group">
          <div>
            <label for="age">السن</label>
            <input type="number" id="age" name="السن" min="4" max="30" required placeholder="4 – 30">
          </div>
        </div>
        <div class="field-group">
          <div>
            <label for="phone">رقم الموبايل</label>
            <input type="tel" id="phone" name="رقم الموبايل" required placeholder="01xxxxxxxxx">
          </div>
        </div>



  
        <div class="field-group">

<label>
هل لدى المشترك لة المشاكل التالية
</label>

<div class="check-group">
  <label class="check-option">
   <input type="checkbox" name="حساسية" value="حساسية" > 
   <span> حساسية</span>
  </label>


  <label class="check-option">
   <input type="checkbox" name="ربو" value="ربو" > 
   <span> ربو</span>
  </label>

  <label class="check-option">
   <input type="checkbox" name="يتناول الدواء" value="يتناول الدواء" > 
   <span> يتناول الدواء</span>
  </label>



  <label class="check-option">
   <input type="checkbox" name="ذوي احتياجات خاصة" value="ذوي احتياجات خاصة" > 
   <span> ذوي احتياجات خاصة</span>
  </label>

<label class="check-option">
   <input type="checkbox" name="لا شيء" value="لا شيء" > 
   <span> لا شيء</span>
  </label>

</div>


        </div>
        <div class="field-group">
          <label>النوع</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="gender" value="ذكر" required>
              <span>👦 ذكر</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="gender" value="أنثى">
              <span>👧 أنثى</span>
            </label>
          </div>
        </div>
   



      
        <button type="submit" class="submit-btn">
          إرسال الطلب ✦
        </button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
